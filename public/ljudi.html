<!DOCTYPE html>
<html lang="sr-Latn-ME">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ljudi — sanitarne knjižice i nalozi</title>
<style>
  :root{
    --ink:#131A1F; --steel:#3A4A56; --muted:#6B7A85;
    --paper:#EFF2F3; --list:#FFF; --linija:#CBD5D9;
    --cold:#0B6E8C; --signal:#B4410E; --ok:#2C6B47; --alarm:#96161B;
    --mono: ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
  .oznaka{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  header{background:var(--ink);color:#fff;padding:16px}
  header h1{margin:5px 0 0;font-size:19px;font-weight:600}
  header .oznaka{color:#8FA6B2}
  .nav{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:10px;
    border-top:1px solid #2C3A44;font-size:13px}
  .nav a{color:#8FA6B2;text-decoration:none}
  .nav a:hover,.nav a.tu{color:#fff}
  .nav a.tu{font-weight:600}

  main{max-width:1000px;margin:18px auto;padding:0 14px 90px}

  .jezicci{display:flex;border-bottom:2px solid var(--linija);margin-bottom:18px;flex-wrap:wrap}
  .jezicci button{font-family:var(--sans);font-size:14.5px;font-weight:600;padding:11px 18px;
    border:none;background:transparent;color:var(--muted);cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-2px}
  .jezicci button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--cold)}
  .jezicci button:focus-visible{outline:2px solid var(--cold);outline-offset:-2px}

  .traka{padding:12px 14px;font-size:13.5px;line-height:1.55;margin-bottom:16px;border-left:3px solid}
  .traka.info{border-color:var(--cold);background:#E6EEF1;color:#08536B}
  .traka.ok{border-color:var(--ok);background:#E4EFE8;color:#1C4A30}
  .traka.pazi{border-color:var(--signal);background:#F7E9E3;color:#7A2C07}
  .traka.alarm{border-color:var(--alarm);background:#F6E3E4;color:#6E1013}
  .traka b{display:block;margin-bottom:2px}

  .kartica{background:var(--list);border:1px solid var(--linija);padding:16px 17px;margin-bottom:16px}
  .kartica h2{margin:0 0 4px;font-size:16px}
  .kartica .sta{font-size:13px;color:var(--muted);margin-bottom:14px}

  label{display:block;font-size:13px;font-weight:600;margin:11px 0 4px}
  label .sitno{font-weight:400;color:var(--muted)}
  input,select{width:100%;font-family:var(--sans);font-size:15.5px;padding:10px 11px;
    border:1px solid var(--linija);border-radius:3px;background:#FCFDFD;color:var(--ink)}
  .par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .par3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  @media(max-width:620px){.par,.par3{grid-template-columns:1fr}}

  .dugme{padding:12px 22px;font-size:15px;font-weight:600;border:none;border-radius:3px;
    background:var(--cold);color:#fff;cursor:pointer;font-family:var(--sans);margin-top:16px}
  .dugme:disabled{background:var(--muted);cursor:default}
  .dugme.tiho{background:transparent;color:var(--steel);border:1px solid var(--linija)}

  table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  th,td{border-bottom:1px solid var(--linija);padding:8px 9px;text-align:left;vertical-align:top}
  th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);font-weight:600}
  td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
  td.d{font-family:var(--mono);white-space:nowrap}
  tr.pazi td{background:#FBF4EF}
  tr.alarm td{background:#F9EBEC}
  .znak{font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:2px 6px;
    border-radius:2px;text-transform:uppercase;white-space:nowrap}
  .znak.ok{background:#D9E9DF;color:#1C4A30}
  .znak.pazi{background:#F4DFD5;color:#7A2C07}
  .znak.alarm{background:#F0D3D5;color:#6E1013}
  .znak.tiho{background:#E3E8EA;color:#4A5B66}
  .prazno{color:var(--muted);padding:22px 0;text-align:center}
  .veza{background:none;border:none;color:var(--cold);cursor:pointer;font-size:13px;
    font-family:var(--sans);padding:0;text-decoration:underline}
  .sifra{font-family:var(--mono);font-size:16px;letter-spacing:.06em}
</style>
</head>
<body>

<header>
  <span class="oznaka">Ko rukuje hranom i ko ima nalog</span>
  <h1>Ljudi</h1>
  <nav class="nav">
    <span id="koSam" style="color:#8FA6B2"></span>
    <a data-samo="vodi" href="/tabla.html">Tabla</a>
    <a class="tu" data-samo="vodi" href="/ljudi.html">Ljudi</a>
    <a data-samo="vodi" href="/podesavanje.html">Dobavljači i kupci</a>
    <a href="/promet.html">Prijem i isporuka</a>
    <a href="/zapisi.html">Dnevni zapisi</a>
    <a data-samo="vodi" href="/sledljivost.html">Sledljivost</a>
    <a data-samo="vodi" href="/prilozi.html">Štampa priloga</a>
    <a data-samo="vodi" href="/izvoz.html">Izvoz</a>
  </nav>
</header>

<main>
  <div class="jezicci" role="tablist" id="jezicci"></div>
  <div id="poruka"></div>
  <div id="sadrzaj"></div>
</main>

<script src="/veza.js"></script>
<script>
let JA = null, AKTIVAN = 'knjizice';

const $  = s => document.querySelector(s);
const el = (t, a = {}, ...d) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  d.flat().forEach(x => n.append(x?.nodeType ? x : document.createTextNode(x ?? '')));
  return n;
};
const poruka = (v, n, t) => { $('#poruka').replaceChildren(
  el('div', { class: 'traka ' + v }, el('b', {}, n), t || '')); };
const dat = s => s ? String(s).slice(0, 10).split('-').reverse().join('.') + '.' : '—';

const JEZICCI = [
  { k: 'knjizice', n: 'Sanitarne knjižice' },
  { k: 'plan',     n: 'Godišnji plan obuke' },
  { k: 'nalozi',   n: 'Nalozi za prijavu' },
];

(async () => {
  JA = await ucitajJa();
  if (!JA) return;
  sakrijNedozvoljeno(JA);
  $('#jezicci').replaceChildren(...JEZICCI.map(j =>
    el('button', { type: 'button', role: 'tab', 'aria-selected': String(j.k === AKTIVAN),
      onclick: () => { AKTIVAN = j.k; crtaj(); } }, j.n)));
  crtaj();
})();

function crtaj() {
  [...$('#jezicci').children].forEach((b, i) =>
    b.setAttribute('aria-selected', String(JEZICCI[i].k === AKTIVAN)));
  $('#poruka').replaceChildren();
  if (AKTIVAN === 'knjizice') knjizice();
  else if (AKTIVAN === 'plan') planObuke();
  else nalozi();
}

/* ==================================================== godišnji plan obuke */
// Plan se pravi unaprijed i ostaje u evidenciji i kad se ne ostvari. Zato
// stavka nema „obriši" nego „održano" — propuštena obuka je nalaz, ne greška
// u unosu, i briše se samo ako je greškom upisana.
let GODINA = new Date().getFullYear();

const STANJE_PLANA = {
  'urađeno':     ['ok',    'održano'],
  'kasni':       ['alarm', 'kasni'],
  'uskoro':      ['pazi',  'uskoro'],
  'planirano':   ['tiho',  'planirano'],
  'bez termina': ['tiho',  'bez termina'],
};

async function planObuke() {
  $('#sadrzaj').replaceChildren(el('div', { class: 'prazno' }, 'Učitavam…'));
  let d = { stavke: [], godine: [], godina: GODINA };
  try { d = await api('/api/cg/plan-obuke?godina=' + GODINA); }
  catch (e) {
    poruka('alarm', 'Ne mogu da učitam plan', e.message
      + (/v_plan_obuke|plan_obuke/.test(e.message)
          ? ' — pokreni: node alati\\dopune.mjs' : ''));
  }

  const godine = [...new Set([...d.godine, GODINA, new Date().getFullYear(),
    new Date().getFullYear() + 1])].sort((a, b) => b - a);

  const forma = el('div', { class: 'kartica' },
    el('h2', {}, 'Dodaj stavku plana'),
    el('div', { class: 'sta' },
      'Jedna stavka = jedna obuka za jednu grupu. Plan se pravi unaprijed; '
      + 'kad se obuka održi, upisuje se datum, a stavka ostaje u evidenciji.'),
    el('div', { class: 'par' },
      el('div', {}, el('label', { for: 'pGrupa' }, 'Ciljna grupa ',
          el('span', { class: 'sitno' }, '— ko ide')),
        el('input', { id: 'pGrupa', placeholder: 'magacin · vozači · svi koji rukuju hranom' })),
      el('div', {}, el('label', { for: 'pTema' }, 'Tema'),
        el('input', { id: 'pTema', placeholder: 'Lančana hladnoća i KKT 2' }))),
    el('div', { class: 'par3' },
      el('div', {}, el('label', { for: 'pOblik' }, 'Oblik'),
        el('select', { id: 'pOblik' },
          el('option', { value: 'teorijska' }, 'teorijska'),
          el('option', { value: 'praktična' }, 'praktična'),
          el('option', { value: 'teorijska + praktična' }, 'teorijska + praktična'))),
      el('div', {}, el('label', { for: 'pTermin' }, 'Planirani termin'),
        el('input', { id: 'pTermin', type: 'date' })),
      el('div', {}, el('label', { for: 'pSati' }, 'Trajanje (sati)'),
        el('input', { id: 'pSati', type: 'number', step: '0.5', min: '0' }))),
    el('div', { class: 'par' },
      el('div', {}, el('label', { for: 'pIzvodjac' }, 'Izvođač ',
          el('span', { class: 'sitno' }, '— ko drži obuku')),
        el('input', { id: 'pIzvodjac' })),
      el('div', {}, el('label', { for: 'pOdgovoran' }, 'Odgovoran u firmi'),
        el('input', { id: 'pOdgovoran' }))),
    el('input', { id: 'pId', type: 'hidden' }),
    el('button', { type: 'button', class: 'dugme', onclick: sacuvajStavku }, 'Sačuvaj stavku'));

  const red = s => {
    const [z, tekst] = STANJE_PLANA[s.stanje] || ['tiho', s.stanje];
    return el('tr', { class: s.stanje === 'kasni' ? 'alarm' : s.stanje === 'uskoro' ? 'pazi' : '' },
      el('td', {}, el('b', {}, s.tema),
        el('div', { style: 'color:var(--muted);font-size:12.5px' },
          s.ciljna_grupa + (s.oblik ? ' · ' + s.oblik : ''))),
      el('td', { class: 'd' }, dat(s.planirani_termin),
        s.trajanje_sati ? el('div', { style: 'color:var(--muted);font-size:12px' },
          `${Number(s.trajanje_sati)} h`) : ''),
      el('td', {}, el('span', { class: 'znak ' + z }, tekst),
        s.izvrseno ? el('div', { style: 'color:var(--muted);font-size:12px;margin-top:3px' },
          'održano ' + dat(s.izvrseno)) : ''),
      el('td', {}, s.izvodjac || '—'),
      el('td', {},
        s.izvrseno
          ? el('button', { type: 'button', class: 'veza',
              onclick: () => oznaciOdrzano(s, null) }, 'poništi')
          : el('button', { type: 'button', class: 'veza',
              onclick: () => oznaciOdrzano(s) }, 'održano'),
        ' · ',
        el('button', { type: 'button', class: 'veza',
          onclick: () => popuniStavku(s) }, 'uredi')));
  };

  const kasne = d.stavke.filter(s => s.stanje === 'kasni').length;

  $('#sadrzaj').replaceChildren(
    el('div', { class: 'traka info' },
      el('b', {}, 'Prilog 13 — plan, ne zapis'),
      'Nije zakonom propisan obrazac. Služi kao dokaz da se HACCP postupci '
      + 'primjenjuju i kontinuirano održavaju (čl. 36) i traži ga Vodič UBH. '
      + 'Ono što se ne održi ostaje na spisku — to je pola njegove vrijednosti.'),
    kasne ? el('div', { class: 'traka pazi' },
      el('b', {}, `${pade(kasne, 'stavka plana', 'stavke plana', 'stavki plana')} kasni`),
      'Termin je prošao, a obuka nije zabilježena kao održana.') : '',
    el('div', { class: 'kartica' },
      el('h2', {}, 'Plan za godinu'),
      el('div', { class: 'sta' }, 'Prebacivanjem godine vidiš i prošle planove.'),
      el('select', { style: 'max-width:180px', onchange: ev => {
        GODINA = Number(ev.target.value); planObuke(); } },
        ...godine.map(g => el('option',
          { value: String(g), selected: g === GODINA ? 'selected' : false }, String(g)))),
      d.stavke.length
        ? el('table', {},
            el('thead', {}, el('tr', {},
              el('th', {}, 'Tema i grupa'), el('th', {}, 'Termin'), el('th', {}, 'Stanje'),
              el('th', {}, 'Izvođač'), el('th', {}, ''))),
            el('tbody', {}, ...d.stavke.map(red)))
        : el('div', { class: 'prazno' },
            `Za ${GODINA}. nema nijedne stavke plana. Dodaj bar jednu — obuka bez plana `
            + 'se na kontroli čita kao improvizacija.')),
    forma);
}

function popuniStavku(s) {
  $('#pId').value = s.id;
  $('#pGrupa').value = s.ciljna_grupa || '';
  $('#pTema').value = s.tema || '';
  $('#pOblik').value = s.oblik || 'teorijska';
  $('#pTermin').value = (s.planirani_termin || '').slice(0, 10);
  $('#pSati').value = s.trajanje_sati || '';
  $('#pIzvodjac').value = s.izvodjac || '';
  $('#pOdgovoran').value = s.odgovoran || '';
  $('#pGrupa').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function sacuvajStavku() {
  const grupa = $('#pGrupa').value.trim(), tema = $('#pTema').value.trim();
  if (!grupa || !tema) return poruka('pazi', 'Ciljna grupa i tema su obavezne', '');
  try {
    await api('/api/cg/plan-obuke', { method: 'POST', body: JSON.stringify({
      id: $('#pId').value || undefined,
      godina: GODINA,
      ciljna_grupa: grupa, tema,
      oblik: $('#pOblik').value,
      planirani_termin: $('#pTermin').value || null,
      trajanje_sati: $('#pSati').value || null,
      izvodjac: $('#pIzvodjac').value.trim() || null,
      odgovoran: $('#pOdgovoran').value.trim() || null,
    }) });
    poruka('ok', 'Upisano', `${tema} — ${grupa}`);
    planObuke();
  } catch (e) { poruka('alarm', 'Nije upisano', e.message); }
}

async function oznaciOdrzano(s, datum = undefined) {
  let d = datum;
  if (d === undefined) {
    d = prompt('Kog datuma je obuka održana? (GGGG-MM-DD)', danas());
    if (d === null) return;
  }
  try {
    await api(`/api/cg/plan-obuke/${s.id}/izvrseno`, { method: 'POST',
      body: JSON.stringify({ izvrseno: d || null }) });
    poruka('ok', d ? 'Zabilježeno kao održano' : 'Poništeno', s.tema);
    planObuke();
  } catch (e) { poruka('alarm', 'Nije promijenjeno', e.message); }
}

/* ==================================================== sanitarne knjižice */
async function knjizice() {
  $('#sadrzaj').replaceChildren(el('div', { class: 'prazno' }, 'Učitavam…'));
  let spisak = [];
  try { spisak = await api('/api/cg/lica'); }
  catch (e) { poruka('alarm', 'Ne mogu da učitam spisak', e.message); }

  const forma = el('div', { class: 'kartica' },
    el('h2', {}, 'Dodaj ili ispravi lice'),
    el('div', { class: 'sta' },
      'Upisuje se broj i rok važenja knjižice — nikad nalaz ljekarskog pregleda. '
      + 'Isto ime dva puta ne pravi dupli red, nego dopunjava postojeći.'),
    el('div', { class: 'par' },
      el('div', {}, el('label', { for: 'ime' }, 'Ime i prezime'),
        el('input', { id: 'ime', placeholder: 'Ime Prezime' })),
      el('div', {}, el('label', { for: 'rm' }, 'Radno mjesto'),
        el('input', { id: 'rm', placeholder: 'magacioner · vozač · komercijalista' }))),
    el('div', {}, el('label', { for: 'posao' }, 'Šta radi sa hranom ',
        el('span', { class: 'sitno' }, '— prijem, slaganje u hladnjaču, utovar, prevoz')),
      el('input', { id: 'posao', placeholder: 'prijem i slaganje u hladnjaču' })),
    el('div', { class: 'par3' },
      el('div', {}, el('label', { for: 'kbroj' }, 'Broj knjižice'),
        el('input', { id: 'kbroj' })),
      el('div', {}, el('label', { for: 'kizd' }, 'Izdata'),
        el('input', { id: 'kizd', type: 'date' })),
      el('div', {}, el('label', { for: 'kvazi' }, 'Važi do'),
        el('input', { id: 'kvazi', type: 'date' }))),
    el('div', {}, el('label', { for: 'sifra' }, 'Šifra sa ceduljice ',
        el('span', { class: 'sitno' }, '— ona koju upisuje u zapise, ako je ima')),
      el('input', { id: 'sifra', placeholder: 'npr. M-04' })),
    el('button', { type: 'button', class: 'dugme', onclick: sacuvajLice }, 'Sačuvaj'));

  const red = l => {
    const v = l.stanje_knjizice;
    const klasa = v === 'istekla' ? 'alarm' : (v === 'ističe' || v === 'nema podatka') ? 'pazi' : '';
    const znak = v === 'istekla' ? 'alarm' : v === 'ističe' ? 'pazi'
               : v === 'nema podatka' ? 'tiho' : 'ok';
    return el('tr', { class: klasa },
      el('td', {}, el('b', {}, l.ime_prezime),
        l.posao_sa_hranom ? el('div', { style: 'color:var(--muted);font-size:12.5px' },
          l.posao_sa_hranom) : ''),
      el('td', {}, l.radno_mjesto || '—'),
      el('td', { class: 'd' }, l.knjizica_broj || '—'),
      el('td', { class: 'd' }, dat(l.knjizica_vazi_do)),
      el('td', {}, el('span', { class: 'znak ' + znak }, v),
        l.dana_do_isteka !== null && l.dana_do_isteka !== undefined && v !== 'važi'
          ? el('div', { style: 'color:var(--muted);font-size:12px;margin-top:2px' },
              l.dana_do_isteka < 0
                ? `prije ${pade(-l.dana_do_isteka, 'dan', 'dana', 'dana')}`
                : `za ${pade(l.dana_do_isteka, 'dan', 'dana', 'dana')}`) : ''),
      el('td', {}, el('button', { type: 'button', class: 'veza',
        onclick: () => popuni(l) }, 'uredi')));
  };

  const tabela = spisak.length
    ? el('table', {},
        el('thead', {}, el('tr', {},
          el('th', {}, 'Lice'), el('th', {}, 'Radno mjesto'), el('th', {}, 'Knjižica'),
          el('th', {}, 'Važi do'), el('th', {}, 'Stanje'), el('th', {}, ''))),
        el('tbody', {}, ...spisak.map(red)))
    : el('div', { class: 'prazno' },
        'Nijedno lice još nije upisano. Dok je spisak prazan, na kontroli nema čime da se '
        + 'pokaže ko smije da rukuje hranom.');

  $('#sadrzaj').replaceChildren(
    el('div', { class: 'traka info' },
      el('b', {}, 'Zašto ovo stoji ovdje'),
      'Sanitarna knjižica je jedina obaveza u ovoj oblasti sa izričitom kaznom — '
      + 'Zakon o zaštiti stanovništva od zaraznih bolesti, čl. 31, 2.500–20.000 €. '
      + 'Lice kojem je knjižica istekla ne smije da rukuje hranom ni jedan dan.'),
    forma,
    el('div', { class: 'kartica' },
      el('h2', {}, 'Lica koja rukuju hranom'),
      el('div', { class: 'sta' }, 'Poređano po roku — prvo ono što ističe.'),
      tabela));
}

function popuni(l) {
  $('#ime').value   = l.ime_prezime || '';
  $('#rm').value    = l.radno_mjesto || '';
  $('#posao').value = l.posao_sa_hranom || '';
  $('#kbroj').value = l.knjizica_broj || '';
  $('#kizd').value  = (l.knjizica_izdata || '').slice(0, 10);
  $('#kvazi').value = (l.knjizica_vazi_do || '').slice(0, 10);
  $('#sifra').value = l.sifra || '';
  $('#ime').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function sacuvajLice() {
  const ime = $('#ime').value.trim();
  if (!ime) return poruka('pazi', 'Ime i prezime su obavezni', '');
  try {
    await api('/api/cg/lica', { method: 'POST', body: JSON.stringify({
      ime_prezime: ime,
      radno_mjesto: $('#rm').value.trim() || null,
      posao_sa_hranom: $('#posao').value.trim() || null,
      knjizica_broj: $('#kbroj').value.trim() || null,
      knjizica_izdata: $('#kizd').value || null,
      knjizica_vazi_do: $('#kvazi').value || null,
      sifra: $('#sifra').value.trim() || null,
    }) });
    poruka('ok', 'Upisano', `${ime} je na spisku.`);
    knjizice();
  } catch (e) { poruka('alarm', 'Nije upisano', e.message); }
}

/* ============================================================ nalozi */

// Šta koja uloga stvarno vidi. Stoji ovdje da se ne pogađa iz naziva.
const STA_VIDI = {
  operater: 'Prijem, isporuka i dnevni zapisi — i to samo posljednja dva dana. '
          + 'Ne vidi sledljivost, izvoz, podešavanje ni ovu stranu.',
  bzr:      'Sve o hrani: tabla, zapisi, sledljivost, štampa, izvoz, podešavanje '
          + 'i ovu stranu. Ne vidi banku pitanja.',
  uprava:   'Samo zbirni izvještaj za direktora — bez imena i bez šifara. Ne unosi ništa.',
  izvodjac: 'Sve, uključujući komandnu tablu i banku pitanja.',
};

async function nalozi() {
  $('#sadrzaj').replaceChildren(el('div', { class: 'prazno' }, 'Učitavam…'));
  let spisak = [], lica = [];
  try { [spisak, lica] = await Promise.all([api('/api/korisnici'), api('/api/cg/lica')]); }
  catch (e) { poruka('alarm', 'Ne mogu da učitam naloge', e.message); }

  const samoOperateri = JA.uloga !== 'izvodjac';
  const bezNaloga = lica.filter(l => !spisak.some(k => k.lice_id === l.id));

  const forma = el('div', { class: 'kartica' },
    el('h2', {}, 'Otvori nalog'),
    el('div', { class: 'sta' }, samoOperateri
      ? 'Možeš da otvoriš nalog za magacin i prevoz. Naloge odgovornog lica, uprave i '
        + 'konsultanta otvara konsultant.'
      : 'Konsultantski nalog — bira se uloga.'),

    el('div', {}, el('label', { for: 'nLice' }, 'Ko dobija nalog ',
        el('span', { class: 'sitno' }, '— sa spiska lica; odatle se uzimaju ime i šifra')),
      el('select', { id: 'nLice', onchange: osvjeziIzbor },
        el('option', { value: '' }, bezNaloga.length
          ? '— izaberi lice —' : '— svi sa spiska već imaju nalog —'),
        ...bezNaloga.map(l => el('option', { value: String(l.id) },
          `${l.ime_prezime}${l.sifra ? ' · ' + l.sifra : ' · bez šifre'}`
          + `${l.radno_mjesto ? ' · ' + l.radno_mjesto : ''}`)),
        el('option', { value: 'rucno' }, '— nije na spisku, upisujem ručno —'))),

    el('div', { class: 'par' },
      el('div', {}, el('label', { for: 'nEmail' }, 'E-mail ',
          el('span', { class: 'sitno' }, '— njime se prijavljuje')),
        el('input', { id: 'nEmail', type: 'email', placeholder: 'ime@firma.me' })),
      el('div', { id: 'omotIme', hidden: true },
        el('label', { for: 'nIme' }, 'Ime i prezime'),
        el('input', { id: 'nIme', placeholder: 'Ime Prezime' }))),

    samoOperateri
      ? el('div', {},
          el('label', {}, 'Uloga'),
          el('div', { style: 'padding:10px 11px;border:1px solid var(--linija);'
            + 'background:#F2F5F6;border-radius:3px;font-size:14.5px' },
            el('b', {}, 'magacin i prevoz'), ' — ', STA_VIDI.operater))
      : el('div', {},
          el('label', { for: 'nUloga' }, 'Uloga'),
          el('select', { id: 'nUloga', onchange: osvjeziIzbor },
            el('option', { value: 'operater' }, 'magacin i prevoz — unosi zapise'),
            el('option', { value: 'bzr' }, 'odgovorno lice za bezbjednost hrane'),
            el('option', { value: 'uprava' }, 'direktor — samo pogled'),
            el('option', { value: 'izvodjac' }, 'konsultant — sve')),
          el('div', { id: 'objasnjenje', class: 'sta', style: 'margin:8px 0 0' })),

    el('button', { type: 'button', class: 'dugme', onclick: otvoriNalog }, 'Otvori nalog'),
    el('div', { id: 'novaLozinka', style: 'margin-top:14px' }));

  const red = k => el('tr', {},
    el('td', {}, el('b', {}, k.ime),
      el('div', { style: 'color:var(--muted);font-size:12.5px' }, k.email),
      k.radno_mjesto
        ? el('div', { style: 'color:var(--muted);font-size:12.5px' }, k.radno_mjesto) : ''),
    el('td', { class: 'd' }, k.sifra
      ? el('span', { class: 'znak ok' }, k.sifra)
      : el('div', {},
          el('span', { class: 'znak tiho', title: 'Nalog nije vezan za lice sa spiska' },
            'bez šifre'),
          bezNaloga.length
            ? el('div', { style: 'margin-top:5px' },
                el('select', { id: 'vez' + k.id, style: 'font-size:12.5px;padding:5px 6px' },
                  el('option', { value: '' }, '— poveži sa —'),
                  ...bezNaloga.map(l => el('option', { value: String(l.id) },
                    l.ime_prezime + (l.sifra ? ` · ${l.sifra}` : '')))),
                el('button', { type: 'button', class: 'veza',
                  style: 'margin-top:4px;display:block',
                  onclick: () => povezi(k) }, 'poveži'))
            : '')),
    el('td', {}, el('span', { class: 'znak ' + (k.uloga === 'operater' ? 'tiho' : 'ok') },
      IME_ULOGE[k.uloga] || k.uloga),
      el('div', { style: 'color:var(--muted);font-size:12px;margin-top:3px;max-width:30ch' },
        STA_VIDI[k.uloga] || '')),
    el('td', {}, k.aktivan
      ? el('span', { class: 'znak ok' }, 'radi')
      : el('span', { class: 'znak alarm' }, 'zatvoren'),
      el('div', { style: 'color:var(--muted);font-size:12px;margin-top:3px' },
        k.poslednja_prijava
          ? dat(lokalniDatum(new Date(k.poslednja_prijava))) : 'nikad se nije prijavio')),
    el('td', {},
      el('button', { type: 'button', class: 'veza',
        onclick: () => promijeni(k) }, k.aktivan ? 'zatvori' : 'otvori'),
      ' · ',
      el('button', { type: 'button', class: 'veza',
        onclick: () => novaLozinka(k) }, 'nova lozinka')));

  const bezSifre = spisak.filter(k => !k.sifra && k.uloga === 'operater').length;

  $('#sadrzaj').replaceChildren(
    el('div', { class: 'traka info' },
      el('b', {}, 'Nalog nije isto što i lice sa spiska'),
      'Na spisku su svi koji rukuju hranom. Nalog dobija samo onaj ko nešto unosi u '
      + 'aplikaciju. Nalog se veže za lice sa spiska, pa se ime i šifra čitaju sa '
      + 'jednog mjesta i ne mogu se razići.'),
    bezSifre ? el('div', { class: 'traka pazi' },
      el('b', {}, `${pade(bezSifre, 'nalog', 'naloga', 'naloga')} bez šifre`),
      'Ti nalozi su otvoreni prije spiska lica. Upiši to lice na prvom jezičku sa '
      + 'istom šifrom, pa ću ih povezati — do tada se iz baze ne vidi ko stoji iza zapisa.')
      : '',
    forma,
    el('div', { class: 'kartica' },
      el('h2', {}, 'Postojeći nalozi'),
      el('div', { class: 'sta' }, 'Ko se prijavljuje, čime potpisuje zapise i šta smije da vidi.'),
      spisak.length
        ? el('table', {},
            el('thead', {}, el('tr', {},
              el('th', {}, 'Ko'), el('th', {}, 'Šifra'), el('th', {}, 'Uloga i šta vidi'),
              el('th', {}, 'Stanje'), el('th', {}, ''))),
            el('tbody', {}, ...spisak.map(red)))
        : el('div', { class: 'prazno' }, 'Nema naloga koje smiješ da vidiš.')));

  osvjeziIzbor();
}

// Ručni unos imena ima smisla samo kad lice nije sa spiska (npr. konsultant).
function osvjeziIzbor() {
  const lice = $('#nLice') ? $('#nLice').value : '';
  const omot = $('#omotIme');
  if (omot) omot.hidden = lice !== 'rucno';
  const o = $('#objasnjenje');
  if (o && $('#nUloga')) o.textContent = STA_VIDI[$('#nUloga').value] || '';
}

async function otvoriNalog() {
  const email = $('#nEmail').value.trim();
  const izbor = $('#nLice') ? $('#nLice').value : '';
  const ime = $('#nIme') ? $('#nIme').value.trim() : '';
  if (!email) return poruka('pazi', 'Upiši e-mail', 'Njime se korisnik prijavljuje.');
  if (!izbor) return poruka('pazi', 'Izaberi ko dobija nalog',
    'Ako čovjeka nema na spisku, upiši ga prvo na jezičku „Sanitarne knjižice".');
  if (izbor === 'rucno' && !ime) return poruka('pazi', 'Upiši ime i prezime', '');
  const uloga = $('#nUloga') ? $('#nUloga').value : 'operater';
  try {
    const d = await api('/api/korisnici', { method: 'POST', body: JSON.stringify({
      email, uloga,
      lice_id: izbor === 'rucno' ? null : Number(izbor),
      ime: izbor === 'rucno' ? ime : undefined }) });
    $('#novaLozinka').replaceChildren(el('div', { class: 'traka alarm' },
      el('b', {}, 'Zapiši lozinku sada — više se neće prikazati.'),
      el('div', {}, `${d.ime} · ${IME_ULOGE[d.uloga] || d.uloga}`
        + (d.sifra ? ` · šifra ${d.sifra}` : '')),
      el('div', {}, email, ' · ', el('span', { class: 'sifra' }, d.lozinka)),
      el('div', { style: 'margin-top:4px' },
        'Lozinku mijenja sam pri prvoj prijavi. Šifra je nešto drugo — njome potpisuje zapise.')));
    nalozi();
  } catch (e) { poruka('alarm', 'Nalog nije otvoren', e.message); }
}

// Nalog otvoren prije nego što je spisak lica postojao — veže se naknadno.
async function povezi(k) {
  const izbor = $('#vez' + k.id);
  if (!izbor || !izbor.value) return poruka('pazi', 'Izaberi lice', '');
  try {
    const d = await api(`/api/korisnici/${k.id}/lice`, { method: 'POST',
      body: JSON.stringify({ lice_id: Number(izbor.value) }) });
    poruka('ok', 'Povezano',
      `${d.ime}${d.sifra ? ' · šifra ' + d.sifra : ' — to lice nema upisanu šifru'}`);
    nalozi();
  } catch (e) { poruka('alarm', 'Nije povezano', e.message); }
}

async function promijeni(k) {
  try {
    await api(`/api/korisnici/${k.id}/stanje`, { method: 'POST',
      body: JSON.stringify({ aktivan: !k.aktivan }) });
    poruka('ok', k.aktivan ? 'Nalog zatvoren' : 'Nalog otvoren',
      k.aktivan ? `${k.ime} više ne može da se prijavi.` : `${k.ime} ponovo radi.`);
    nalozi();
  } catch (e) { poruka('alarm', 'Nije promijenjeno', e.message); }
}

async function novaLozinka(k) {
  try {
    const d = await api(`/api/korisnici/${k.id}/nova-lozinka`, { method: 'POST' });
    poruka('alarm', 'Nova lozinka — zapiši je sada',
      `${k.email} · ${d.lozinka}`);
  } catch (e) { poruka('alarm', 'Nije promijenjeno', e.message); }
}
</script>
